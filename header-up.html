  <style>
    .header1 {

      font-style: italic;
      font-family: Roboto, Arial;
      text-decoration: underline;
      border-color: black;
      border-width: 50px;
      border-radius: 10px;
      cursor: pointer;
      position: fixed;
      top:0;
      left: 0;
      right: 0;
    }

    .header1:hover {

      color: white;
      opacity: 0.8px;
    }

    .header2 {

      margin-top: 90px;

      flex-direction: row;

      border-width: 2px;
      border-color: black;
      cursor: pointer;
    }

    .header3 {
      margin-top: 20px;
      height: 70px;
      border-style: solid;
      border-width: 1px;
      border-color: black;
      display: flex;

</head>
